<!-- POR QUE ESTA PAGINA EXISTE
     O portfolio vive em robsonobre.com.br desde agosto de 2026. Este endereco
     continuava servindo a versao de marco, sem canonical, competindo com o
     dominio novo pelas mesmas buscas: dois sites do mesmo autor disputando o
     mesmo nome dividem a forca em vez de somar.
     O canonical junta os dois num so aos olhos do Google. O refresh e o script
     levam quem chegar aqui pro lugar certo. Nada de robots.txt bloqueando:
     pagina bloqueada nao e lida, e canonical que ninguem le nao serve pra nada. -->
