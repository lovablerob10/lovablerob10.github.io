# A maquina de noticias roda sozinha duas vezes por dia.
# Le os feeds, escreve as notas, gera o HTML e publica no Cloudflare Pages.
# O estado (quais links ja foram vistos) volta para o repositorio no fim,
# senao a proxima rodada reescreveria as mesmas noticias.
name: maquina de noticias

on:
  schedule:
    - cron: '0 11 * * *'   # 08h de Brasilia
    - cron: '0 21 * * *'   # 18h de Brasilia
  workflow_dispatch:        # botao de rodar agora, na aba Actions

concurrency:
  group: noticias
  cancel-in-progress: false   # duas rodadas juntas brigariam pelo mesmo estado

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with: { node-version: '22' }

      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }

      # O repositorio nao declara dependencia nenhuma, e essa simplicidade e
      # metade do motivo de ele nunca quebrar. O sharp entra so aqui, na
      # maquina do CI, para converter a capa de PNG de 1,5 MB para webp.
      - name: ferramenta de imagem
        run: npm install --no-save --no-audit --no-fund sharp

      - name: escrever as notas
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          NEWS_MODEL: anthropic/claude-sonnet-4.5
        run: node maquina-noticias.mjs

      - name: publicar no Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash publicar.sh

      # depois do deploy, nao antes: o link precisa estar no ar quando a
      # mensagem chega no celular dele.
      - name: avisar no WhatsApp
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_PHONE_NUMBER_ID: ${{ secrets.META_PHONE_NUMBER_ID }}
        run: node avisar-zap.mjs

      # roda mesmo se o deploy falhar: nota escrita nao pode se perder,
      # a proxima rodada publica o que ficou parado.
      - name: guardar o que saiu
        if: always()
        run: |
          git config user.name  "maquina de noticias"
          git config user.email "agentevibeflow@gmail.com"
          git add noticias .noticias-vistas.json
          git diff --cached --quiet && echo "nada novo nesta rodada" && exit 0
          git commit -m "noticias: rodada de $(TZ=America/Sao_Paulo date '+%d/%m %H:%M')"
          git push
